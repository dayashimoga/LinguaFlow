version: '3.8'

services:
  gateway:
    container_name: linguaflow-gateway
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - LINGUAFLOW_DATA_DIR=/data
    volumes:
      - linguaflow-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  linguaflow-data:
    driver: local
